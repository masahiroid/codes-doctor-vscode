name: 'Codes Doctor Codebase Health Check'
description: 'Automated static analysis, God class detection, circular dependency tracking, and security audit'
inputs:
  path:
    description: 'Path or directory to analyze'
    required: false
    default: '.'
  min-security:
    description: 'Fail if the security score is below this minimum'
    required: false
  min-debt:
    description: 'Fail if the technical debt score is below this minimum'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Run Codes Doctor Analysis
      shell: bash
      env:
        ANALYZE_PATH: ${{ inputs.path }}
        MIN_SECURITY: ${{ inputs.min-security }}
        MIN_DEBT: ${{ inputs.min-debt }}
      # Runs the npm release matching the ref this action was pinned to.
      run: |
        version=$(node -p "require(process.env.GITHUB_ACTION_PATH + '/packages/cli/package.json').version")
        args=(analyze "$ANALYZE_PATH")
        [ -n "$MIN_SECURITY" ] && args+=(--min-security "$MIN_SECURITY")
        [ -n "$MIN_DEBT" ] && args+=(--min-debt "$MIN_DEBT")
        npx --yes "codesdoctor@$version" "${args[@]}"
