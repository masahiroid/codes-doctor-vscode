version: '3.8'

services:
  csap:
    build:
      context: .
      dockerfile: Dockerfile_production
    container_name: csap-app
    image: csap:latest
    
    ports:
      - "${PORT:-3000}:3000"
    
    environment:
      # Core configuration
      PORT: ${PORT:-3000}
      NODE_ENV: production
      
      # LLM configuration (optional)
      CSAP_LLM_ENABLED: ${CSAP_LLM_ENABLED:-false}
      CSAP_LLM_MODEL: ${CSAP_LLM_MODEL:-gpt-4o-mini}
      CSAP_LLM_MAX_TOKENS: ${CSAP_LLM_MAX_TOKENS:-700}
      CSAP_LLM_TEMPERATURE: ${CSAP_LLM_TEMPERATURE:-0.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Feature flags
      CSAP_PHP_ENABLED: ${CSAP_PHP_ENABLED:-true}
      
      # Resource limits
      CSAP_MAX_FILE_SIZE: ${CSAP_MAX_FILE_SIZE:-524288000}
    
    volumes:
      # Data persistence
      - ./volumes/uploads:/app/uploads
      - ./volumes/temp:/app/temp
      - ./volumes/output:/app/output
    
    # Resource constraints
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
